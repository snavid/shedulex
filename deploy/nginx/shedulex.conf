# Shedulex API — reverse proxy to Kong (Docker, localhost only)
# Install:
#   sudo cp deploy/nginx/shedulex.conf /etc/nginx/sites-available/shedulex
#   sudo ln -sf /etc/nginx/sites-available/shedulex /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream shedulex_kong {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name shedulex.hudumatech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shedulex.hudumatech.com;

    ssl_certificate     /etc/letsencrypt/live/shedulex.hudumatech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shedulex.hudumatech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    access_log /var/log/nginx/shedulex.access.log;
    error_log  /var/log/nginx/shedulex.error.log;

    location / {
        proxy_pass http://shedulex_kong;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 60s;
    }
}
