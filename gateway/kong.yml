_format_version: "3.0"
_transform: true

# Upstreams use Docker DNS hostnames so Kong re-resolves after container recreate.
# KONG_DNS_STALE_TTL=1 (docker-compose) refreshes stale IPs quickly.
# After rebuilding a backend service, run: docker compose restart kong
# or: bash scripts/restart-backend.sh <service-names>
#
# No active healthchecks: each upstream has a single target, so one failed probe
# marks the only peer unhealthy and Kong returns 503 "failed to get a peer from
# the ring-balancer" even while the service is up.
upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:5001
        weight: 100
  - name: timetable-upstream
    targets:
      - target: timetable-engine:5002
        weight: 100
  - name: adjustment-upstream
    targets:
      - target: adjustment-engine:5003
        weight: 100
  - name: notification-upstream
    targets:
      - target: notification-service:5004
        weight: 100
  - name: calendar-upstream
    targets:
      - target: calendar-service:5005
        weight: 100
  - name: document-upstream
    targets:
      - target: document-service:5006
        weight: 100
  - name: analytics-upstream
    targets:
      - target: analytics-service:5007
        weight: 100
  - name: audit-upstream
    targets:
      - target: audit-service:5008
        weight: 100

# --- Services ---
services:

  - name: auth-service
    protocol: http
    host: auth-upstream
    port: 80
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
          - /api/v1/users
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: auth-portal-public
    protocol: http
    host: auth-upstream
    port: 80
    routes:
      - name: portal-session
        paths:
          - /api/v1/portal/session
        methods:
          - POST
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          policy: local

  # auth-portal-subscribe uses JWT attach plugin on a dedicated service
  - name: auth-portal-protected
    protocol: http
    host: auth-upstream
    port: 80
    routes:
      - name: portal-subscribe-jwt
        paths:
          - /api/v1/portal/subscribe
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  # Public timetable routes (no JWT) ? used during registration before user has a token
  - name: timetable-public
    protocol: http
    host: timetable-upstream
    port: 80
    routes:
      - name: public-universities-read
        paths:
          - /api/v1/universities
        methods:
          - GET
          - OPTIONS
        strip_path: false
      - name: public-registration-lookups
        paths:
          - /api/v1/departments
          - /api/v1/programs
          - /api/v1/student-groups
        methods:
          - GET
          - OPTIONS
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  - name: timetable-portal
    protocol: http
    host: timetable-upstream
    port: 80
    routes:
      - name: portal-timetable-comments
        paths:
          - /api/v1/portal/timetable
          - /api/v1/portal/comments
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: timetable-admin-comments
    protocol: http
    host: timetable-upstream
    port: 80
    routes:
      - name: admin-comments-routes
        paths:
          - /api/v1/admin/comments
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false

  - name: timetable-service
    protocol: http
    host: timetable-upstream
    port: 80
    routes:
      - name: timetable-routes
        paths:
          - /api/v1/timetable
          - /api/v1/rooms
          - /api/v1/buildings
          - /api/v1/lecturers
          - /api/v1/courses
          - /api/v1/constraints
          - /api/v1/time-slots
          - /api/v1/templates
          - /api/v1/academic-years
          - /api/v1/lecturer-requests
        strip_path: false
      - name: timetable-universities-write
        paths:
          - /api/v1/universities
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
      - name: timetable-registration-resources-write
        paths:
          - /api/v1/departments
          - /api/v1/programs
          - /api/v1/student-groups
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  - name: adjustment-service
    protocol: http
    host: adjustment-upstream
    port: 80
    # Long timeouts needed for SSE streaming connections (up to 5 min idle)
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 360000
    routes:
      - name: adjustment-routes
        paths:
          - /api/v1/adjustments
        strip_path: false
        # Disable response buffering so SSE events reach the client immediately
        response_buffering: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 120
          policy: local

  - name: notification-service
    protocol: http
    host: notification-upstream
    port: 80
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 30
          policy: local

  - name: calendar-service
    protocol: http
    host: calendar-upstream
    port: 80
    routes:
      - name: calendar-routes
        paths:
          - /api/v1/calendar
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false

  - name: document-service
    protocol: http
    host: document-upstream
    port: 80
    routes:
      - name: document-routes
        paths:
          - /api/v1/documents
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false

  - name: analytics-service
    protocol: http
    host: analytics-upstream
    port: 80
    routes:
      - name: analytics-routes
        paths:
          - /api/v1/analytics
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false

  - name: audit-service
    protocol: http
    host: audit-upstream
    port: 80
    routes:
      - name: audit-routes
        paths:
          - /api/v1/audit
        strip_path: false
    plugins:
      - name: jwt
        config:
          secret_is_base64: false

# --- Global plugins ---
# Note: Kong 3.5+ adds X-Kong-Request-Id without the legacy request-id plugin
# (that plugin is not in the default enabled set and breaks DB-less startup).
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:8080"
        - "https://shedulex.hudumatech.com"
        - "https://freetimetable.hudumatech.com"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Kong-Request-Id
        - X-Request-ID
      credentials: true
      max_age: 3600
