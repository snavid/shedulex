# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  shedulex-net:
    driver: bridge

# Kong JWT consumer (interpolated from .env; merged into declarative config at container start)
configs:
  kong_jwt_consumers_fragment:
    content: |
      consumers:
        - username: shedulex-jwt
          jwt_secrets:
            - algorithm: HS256
              key: ${JWT_ISSUER:-shedulex}
              secret: ${JWT_SECRET_KEY:-jwt-secret-change-me}

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  kong_data:
  chroma_data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shedulex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shedulex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shedulex_secret}
      POSTGRES_DB: shedulex_master
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql
    ports:
      - "5543:5432"
    networks:
      - shedulex-net
    healthcheck:
      # pg_isready defaults DB name to the user; POSTGRES_DB is shedulex_master
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shedulex-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6490:6379"
    networks:
      - shedulex-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kong API Gateway ────────────────────────────────────────────────────────
  kong:
    image: kong:3.6-ubuntu
    container_name: shedulex-kong
    environment:
      KONG_DATABASE: "off"
      # Merged at startup: base routes + consumers fragment (JWT key/secret from configs)
      KONG_DECLARATIVE_CONFIG: /tmp/kong-merged.yml
      # Refresh DNS fast when Docker recreates containers (avoids stale upstream IPs).
      # After rebuild: docker compose restart kong  OR  bash scripts/restart-backend.sh <service>
      KONG_DNS_STALE_TTL: 1
      KONG_DNS_ERROR_TTL: 1
      KONG_DNS_TTL: 5
      # Disable keepalive connection pool so Kong re-connects (and re-resolves) after restarts
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: 5
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: 10
      # All bundled Lua plugins (explicit list avoids "plugin X not enabled" on slim defaults)
      KONG_PLUGINS: bundled
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    configs:
      - source: kong_jwt_consumers_fragment
        target: /etc/kong/kong-consumers-fragment.yml
        mode: 0444
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
    command:
      - sh
      - -c
      - |
          set -e
          cat /etc/kong/kong.yml /etc/kong/kong-consumers-fragment.yml > /tmp/kong-merged.yml
          exec /docker-entrypoint.sh kong docker-start
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin API
    networks:
      - shedulex-net
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      timetable-engine:
        condition: service_started
      adjustment-engine:
        condition: service_started
      notification-service:
        condition: service_healthy
      calendar-service:
        condition: service_started
      document-service:
        condition: service_started
      analytics-service:
        condition: service_started
      audit-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Microservices ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./Backend
      dockerfile: auth-service/Dockerfile
    container_name: shedulex-auth
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${AUTH_DB:-auth_db}
      REDIS_URL: redis://redis:6379/0
      AUDIT_SERVICE_URL: http://audit-service:5008
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  timetable-engine:
    build:
      context: ./Backend
      dockerfile: timetable-engine/Dockerfile
    container_name: shedulex-timetable
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${TIMETABLE_DB:-timetable_db}
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      CALENDAR_SERVICE_URL: http://calendar-service:5005
      TIMETABLE_NOTIFY_ENABLED: ${TIMETABLE_NOTIFY_ENABLED:-true}
      AUDIT_SERVICE_URL: http://audit-service:5008
    ports:
      - "5002:5002"
    networks:
      - shedulex-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── ChromaDB Vector Store ────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: shedulex-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8010:8000"
    networks:
      - shedulex-net
    restart: unless-stopped
    healthcheck:
      # chromadb/chroma has no curl — use Python's built-in urllib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  adjustment-engine:
    build:
      context: ./Backend/adjustment-engine
      dockerfile: Dockerfile
    container_name: shedulex-adjustment
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${ADJUSTMENT_DB:-adjustment_db}
      REDIS_URL: redis://redis:6379/0
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    ports:
      - "5003:5003"
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started  # vector_store.py handles unavailability gracefully

  notification-service:
    build:
      context: ./Backend/notification-service
      dockerfile: Dockerfile
    container_name: shedulex-notification
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${NOTIFICATION_DB:-notification_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:5001
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TIMETABLE_NOTIFY_ENABLED: ${TIMETABLE_NOTIFY_ENABLED:-true}
      TIMETABLE_EVENT_DEBOUNCE_SECONDS: ${TIMETABLE_EVENT_DEBOUNCE_SECONDS:-60}
      CALENDAR_SERVICE_URL: http://calendar-service:5005
      BEEM_API_KEY: ${BEEM_API_KEY:-}
      BEEM_SECRET_KEY: ${BEEM_SECRET_KEY:-}
      BEEM_SENDER_NAME: ${BEEM_SENDER_NAME:-SHEDULEX}
      DEFAULT_SMS_PHONE: ${DEFAULT_SMS_PHONE:-+255749300606}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-shedulex}
    ports:
      - "5004:5004"
    restart: unless-stopped
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  notification-worker:
    build:
      context: ./Backend/notification-service
      dockerfile: Dockerfile
    container_name: shedulex-notification-worker
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${NOTIFICATION_DB:-notification_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:5001
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TIMETABLE_NOTIFY_ENABLED: ${TIMETABLE_NOTIFY_ENABLED:-true}
      TIMETABLE_EVENT_DEBOUNCE_SECONDS: ${TIMETABLE_EVENT_DEBOUNCE_SECONDS:-60}
      CALENDAR_SERVICE_URL: http://calendar-service:5005
      BEEM_API_KEY: ${BEEM_API_KEY:-}
      BEEM_SECRET_KEY: ${BEEM_SECRET_KEY:-}
      BEEM_SENDER_NAME: ${BEEM_SENDER_NAME:-SHEDULEX}
      DEFAULT_SMS_PHONE: ${DEFAULT_SMS_PHONE:-+255749300606}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-service-key}
    restart: unless-stopped
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-beat:
    build:
      context: ./Backend/notification-service
      dockerfile: Dockerfile
    container_name: shedulex-notification-beat
    command: celery -A celery_worker.celery beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${NOTIFICATION_DB:-notification_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:5001
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TIMETABLE_NOTIFY_ENABLED: ${TIMETABLE_NOTIFY_ENABLED:-true}
      TIMETABLE_EVENT_DEBOUNCE_SECONDS: ${TIMETABLE_EVENT_DEBOUNCE_SECONDS:-60}
      CALENDAR_SERVICE_URL: http://calendar-service:5005
      BEEM_API_KEY: ${BEEM_API_KEY:-}
      BEEM_SECRET_KEY: ${BEEM_SECRET_KEY:-}
      BEEM_SENDER_NAME: ${BEEM_SENDER_NAME:-SHEDULEX}
      DEFAULT_SMS_PHONE: ${DEFAULT_SMS_PHONE:-+255749300606}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-service-key}
    restart: unless-stopped
    networks:
      - shedulex-net
    depends_on:
      - notification-worker

  calendar-service:
    build:
      context: ./Backend/calendar-service
      dockerfile: Dockerfile
    container_name: shedulex-calendar
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${CALENDAR_DB:-calendar_db}
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
    ports:
      - "5005:5005"
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy

  document-service:
    build:
      context: ./Backend/document-service
      dockerfile: Dockerfile
    container_name: shedulex-document
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${DOCUMENT_DB:-document_db}
      REDIS_URL: redis://redis:6379/0
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
      DOCUMENT_PUBLIC_BASE_URL: ${DOCUMENT_PUBLIC_BASE_URL:-http://localhost:8000}
      EXPORT_CACHE_TTL_SECONDS: ${EXPORT_CACHE_TTL_SECONDS:-300}
      EXPORT_SHARE_TOKEN_MAX_HOURS: ${EXPORT_SHARE_TOKEN_MAX_HOURS:-168}
      DOCUMENT_SHARE_SECRET: ${DOCUMENT_SHARE_SECRET:-}
      DOCUMENT_SHARE_SALT: ${DOCUMENT_SHARE_SALT:-shedulex-document-share}
    ports:
      - "5006:5006"
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ./Backend/analytics-service
      dockerfile: Dockerfile
    container_name: shedulex-analytics
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${ANALYTICS_DB:-analytics_db}
      REDIS_URL: redis://redis:6379/0
      TIMETABLE_SERVICE_URL: http://timetable-engine:5002
    ports:
      - "5007:5007"
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build:
      context: ./Backend/audit-service
      dockerfile: Dockerfile
    container_name: shedulex-audit
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shedulex}:${POSTGRES_PASSWORD:-shedulex_secret}@postgres:5432/${AUDIT_DB:-audit_db}
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:5001
    ports:
      - "5008:5008"
    networks:
      - shedulex-net
    depends_on:
      postgres:
        condition: service_healthy
